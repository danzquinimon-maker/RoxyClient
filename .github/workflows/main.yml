name: Build RoxyClient APK

on:
  push:
    branches:
      - main
      - Moddeps
  pull_request:
    branches:
      - main
      - Moddeps
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        id: gradle
        run: |
          WRAPPER=$(find . -type f -name gradlew -not -path '*/.gradle/*' -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in this repository."
            exit 1
          fi
          chmod +x "$WRAPPER"
          echo "directory=$(dirname "$WRAPPER")" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: .
        run: |
          cd "${{ steps.gradle.outputs.directory }}"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoxyClient-debug
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
